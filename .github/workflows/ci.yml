name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    name: Reproduce generated parser and run upstream corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out pinned upstream grammar
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: alex-pinkus/tree-sitter-swift
          ref: 28fe3a8a85586aa297524fe6164140b9521dcaff
          path: .cache/upstream-grammar
          persist-credentials: false
      - name: Install pinned Tree-sitter CLI
        run: |
          mkdir -p .tools/grammar
          cd .tools/grammar
          curl --fail --location --retry 3 --output tree-sitter.gz https://github.com/tree-sitter/tree-sitter/releases/download/v0.25.10/tree-sitter-linux-x64.gz
          echo '8283ddba69253c698f6e987ba0e2f9285e079c8db4d36ebe1394b5bb3a0ebdfd  tree-sitter.gz' | sha256sum -c -
          gzip -d tree-sitter.gz
          chmod +x tree-sitter
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Regenerate, test the corpus, and compare packaged files
        run: bash scripts/regenerate.sh .cache/upstream-grammar --check

  check:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS / Swift 6.0
            xcode: '16.2'
            swift: '6.0'
          - name: macOS / Swift 6.2
            xcode: '26.2'
            swift: '6.2'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: |
          mkdir -p .cache/ci
          xcodebuild -version | tee .cache/ci/toolchain.log
          swift --version | tee -a .cache/ci/toolchain.log
          swift --version | grep -F 'Apple Swift version ${{ matrix.swift }}.'
      - name: Cache pinned tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tools/ci
          key: tools-v1-${{ runner.os }}-${{ runner.arch }}-xcode-${{ matrix.xcode }}-${{ hashFiles('Makefile', 'scripts/ci/install-tools.sh', 'Package.swift', 'Package.resolved') }}
      - name: Install pinned tools
        run: |
          bash scripts/ci/install-tools.sh 2>&1 | tee .cache/ci/tools.log
          echo "$GITHUB_WORKSPACE/.tools/ci/bin" >> "$GITHUB_PATH"
      - name: Build, test, lint, format, and example
        run: make -k check 2>&1 | tee .cache/ci/check.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-logs-xcode-${{ matrix.xcode }}
          path: .cache/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
